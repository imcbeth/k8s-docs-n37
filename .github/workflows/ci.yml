name: CI

# Validates PRs BEFORE merge.
#
# WHY THIS EXISTS
#
# deploy.yml builds only on push to main, so until now a build-breaking
# change was caught after it had already landed — the deploy failed and
# main sat unpublishable until someone noticed. That happened: a bare
# "(<24h)" in prose parsed as JSX and broke the site on main.
#
# A .pre-commit-config.yaml `docusaurus-build` hook covers the same ground
# locally, but it is opt-in (contributors must install pre-commit), skippable
# with `git commit --no-verify`, and does not run for edits made through the
# GitHub web UI. This job is the enforcement point; the hook stays as the
# fast local signal.
#
# Deliberately NO `paths:` filter. If this is set as a required status check,
# a path-filtered workflow never reports on PRs that miss the filter and
# those PRs block forever waiting for a check that will not arrive.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned to match deploy.yml. If these drift, a PR can pass here
          # and still fail the deploy that actually publishes the site.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        # docusaurus.config.ts sets `onBrokenLinks: 'throw'`, so this fails
        # on broken internal links as well as on MDX/compile errors.
        run: npm run build
