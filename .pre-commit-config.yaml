# Pre-commit hooks for k8s-docs-n37
# See https://pre-commit.com for more information
# Installation: pip install pre-commit && pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Check line endings

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix']
        # MD013: Line length (disabled in .markdownlint.json - docs can be long)
        # MD033: Inline HTML (disabled in .markdownlint.json - Docusaurus uses HTML)
        # MD041: First line heading (disabled in .markdownlint.json - frontmatter comes first)
        # MD018: no-missing-space-atx (disabled in .markdownlint.json) - LOAD-BEARING.
        #   With --fix, MD018 rewrites a line-initial "#955 text" into "# 955 text",
        #   silently turning a wrapped PR reference into an H1. The hook edits the
        #   file and still passes, so nothing surfaces it. The markdown-heading-guard
        #   hook below asserts this stays disabled - do not "tidy" it away.

  # Local checks
  - repo: local
    hooks:
      # Catches the prose that MD018 would silently promote to a heading, and
      # asserts MD018 itself is still disabled. Ported from the homelab repo,
      # where this pattern bit three times before the cause was understood.
      - id: markdown-heading-guard
        name: Markdown heading hazards
        entry: scripts/validate-markdown-headings.py
        language: system
        files: '(\.mdx?$|^\.pre-commit-config\.yaml$|^\.markdownlint\.json$)'
        description: 'Flag line-initial # without a space, and keep MD018 disabled'

      - id: markdown-heading-guard-self-test
        name: markdown heading guard self-test
        entry: scripts/validate-markdown-headings.py --self-test
        language: system
        files: '^scripts/validate-markdown-headings\.py$'
        pass_filenames: false
        description: 'Prove the guard can still fail, not just pass'

      # Docusaurus build check (catches broken links)
      - id: docusaurus-build
        name: Docusaurus build check
        entry: bash -c 'npm run build'
        language: system
        pass_filenames: false
        files: '^docs/.*\.(md|mdx)$'
        verbose: true
        description: 'Build Docusaurus site to catch broken links and build errors'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: Lint YAML files
        args:
          - '-d'
          - |
            extends: default
            rules:
              line-length:
                max: 350
              document-start: disable
              truthy:
                check-keys: false
              indentation:
                spaces: 2
                indent-sequences: consistent
              comments:
                min-spaces-from-content: 1
